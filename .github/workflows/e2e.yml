name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Only the latest e2e run per ref matters; superseded runs are safe to cancel
# (no infrastructure state involved).
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.1'

jobs:
  mocked-settings:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun --cwd packages/common run build
      - run: bunx playwright install --with-deps chromium
        working-directory: ./apps/vela
      - run: bun --cwd apps/vela run test:e2e:mocked
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mocked-settings-results
          path: .artifacts/pw-mocked-*/
          retention-days: 7

  test:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared common package
        run: bun --cwd packages/common run build

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps
        working-directory: ./apps/vela

      - name: Build application
        run: bun --cwd apps/vela run build

      - name: Run Playwright tests
        run: bun --cwd apps/vela run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/vela/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: apps/vela/test-results/
          retention-days: 30
