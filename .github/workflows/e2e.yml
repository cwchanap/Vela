name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    # Stacked PRs target earlier branches, not `main`, so there is no base
    # filter here. Job `if:` filters `edited` to base-branch changes only so
    # PR title/body edits do not re-trigger E2E suites.
    types: [opened, synchronize, reopened, edited, ready_for_review]

# Only the latest e2e run per ref matters; superseded runs are safe to cancel
# (no infrastructure state involved). An `edited` event that did not retarget
# the PR base skips every job below, so it gets a per-run group — sharing the
# ref group would let a no-op title/body edit cancel an in-progress e2e run or
# displace a queued one.
concurrency:
  group: ${{ (github.event.action == 'edited' && github.event.changes.base == null) && format('e2e-skip-{0}', github.run_id) || format('e2e-{0}', github.ref) }}
  cancel-in-progress: true

env:
  BUN_VERSION: '1.3.1'

jobs:
  mocked-settings:
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base != null }}
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun --cwd=packages/common run build
      - run: bunx playwright install --with-deps chromium
        working-directory: ./apps/vela
      - run: bun --cwd=apps/vela run test:e2e:mocked
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mocked-settings-results
          # `.artifacts` is hidden, so upload-artifact's default hidden-file
          # exclusion matched nothing (run 44859605775 uploaded zero files).
          # The glob stays scoped to this suite's synthetic output.
          path: .artifacts/pw-mocked-*/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  unauthenticated-e2e:
    # CI has no Cognito secrets; only unauthenticated and CORS specs run here.
    # Authenticated specs fail in CI if invoked without credentials.
    if: ${{ github.event_name != 'pull_request' || (github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.base != null)) }}
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build shared common package
        run: bun --cwd=packages/common run build

      - name: Install Playwright Browsers
        # playwright.config.ts only defines a chromium project.
        timeout-minutes: 10
        run: bunx playwright install --with-deps chromium
        working-directory: ./apps/vela

      - name: Build application
        run: bun --cwd=apps/vela run build

      - name: Run unauthenticated Playwright tests
        run: bun --cwd=apps/vela run test:e2e:unauthenticated

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: apps/vela/playwright-report/
          retention-days: 30

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: apps/vela/test-results/
          retention-days: 30
