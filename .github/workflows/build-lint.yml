name: Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Retargeting an existing PR changes its base via the `edited` activity.
    # Include it so a PR moved to main reports the required checks.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.1'

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Build frontend
        # This workflow is a lint+build smoke test from a clean checkout, not
        # a deployment: there is no cdk-outputs.json to feed inject-env.ts, so
        # apps/vela-mobile/.env.production (gitignored) is absent. Rather than
        # bypassing the build-time mobile env guard (MOBILE_SKIP_ENV_VALIDATION),
        # set five harmless placeholders that satisfy the complete mobile build
        # contract (API URL, pool, client, OAuth domain, and region) while the
        # reserved example.invalid API hostname remains unreachable.
        # This exercises the normal validation path so a regression in env-file
        # loading or plugin registration fails PR CI instead of slipping through
        # to the release build. The guard still fires for real release builds
        # that run inject-env.ts (which writes a reachable URL).
        env:
          VITE_MOBILE_API_URL: 'https://example.invalid/api/'
          VITE_COGNITO_USER_POOL_ID: us-east-1_ciPlaceholder
          VITE_COGNITO_MOBILE_USER_POOL_CLIENT_ID: ci-mobile-client-id
          VITE_COGNITO_OAUTH_DOMAIN: ci-placeholder.auth.us-east-1.amazoncognito.com
          VITE_AWS_REGION: us-east-1
        run: bun run build

      - name: Build Lambda function
        run: bun --cwd packages/cdk run lambda:build
