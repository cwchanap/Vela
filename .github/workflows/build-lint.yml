name: Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    # Stacked PRs target earlier branches, not `main`, so there is no base
    # filter here. `edited` also covers a PR retargeted after the stack lands.
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:

env:
  BUN_VERSION: '1.3.1'

jobs:
  build-and-lint:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run linter
        run: bun run lint

      - name: Write synthetic production env files
        # These files mirror the VITE_* key sets that inject-env.ts generates
        # after a CDK deploy. CI has no cdk-outputs.json, so the same shape is
        # written with reserved sentinels. The builds read .env.production
        # rather than process-env placeholders, so a regression in Quasar's
        # production env-file loading fails here instead of in deploy.yml.
        run: |
          cat > apps/vela/.env.production <<'EOF'
          VITE_COGNITO_USER_POOL_ID=us-east-1_ciPlaceholder
          VITE_COGNITO_USER_POOL_CLIENT_ID=ci-web-client-sentinel
          VITE_COGNITO_OAUTH_DOMAIN=ci-placeholder.auth.us-east-1.amazoncognito.com
          VITE_COGNITO_REDIRECT_SIGN_IN=https://example.invalid/auth/callback
          VITE_COGNITO_REDIRECT_SIGN_OUT=https://example.invalid/auth/login
          VITE_AWS_REGION=us-east-1
          VITE_API_URL=/api/
          EOF

          cat > apps/vela-mobile/.env.production <<'EOF'
          VITE_MOBILE_API_URL=https://example.invalid/api/
          VITE_COGNITO_USER_POOL_ID=us-east-1_ciPlaceholder
          VITE_COGNITO_MOBILE_USER_POOL_CLIENT_ID=ci-mobile-client-sentinel
          VITE_COGNITO_OAUTH_DOMAIN=ci-placeholder.auth.us-east-1.amazoncognito.com
          VITE_AWS_REGION=us-east-1
          EOF

      - name: Build frontend
        run: bun run build

      - name: Verify built bundles contain only their own injected config
        # Assert each app's sentinels are present in its own bundle and that
        # no marker unique to the other app's env file leaked in — that
        # cross-leak is the copy-paste mistake this gate exists to catch. The
        # shared us-east-1_ciPlaceholder cannot tell the bundles apart, so the
        # forbid checks only use markers unique to one app.
        shell: bash
        run: |
          require_marker() {
            local dir="$1" marker="$2" label="$3"
            if [ ! -d "$dir" ]; then
              echo "::error::$label bundle directory $dir is missing"
              exit 1
            fi
            if ! grep -R -q -F --binary-files=text "$marker" "$dir"; then
              echo "::error::$label bundle does not contain the injected marker: $marker"
              exit 1
            fi
            echo "$label bundle contains $marker"
          }

          forbid_marker() {
            local dir="$1" marker="$2" label="$3"
            if grep -R -q -F --binary-files=text "$marker" "$dir"; then
              echo "::error::$label bundle contains the other app's marker: $marker"
              exit 1
            fi
            echo "$label bundle does not contain $marker"
          }

          require_marker apps/vela/dist/spa 'ci-web-client-sentinel' 'Web'
          require_marker apps/vela/dist/spa 'us-east-1_ciPlaceholder' 'Web'
          forbid_marker apps/vela/dist/spa 'ci-mobile-client-sentinel' 'Web'
          forbid_marker apps/vela/dist/spa 'https://example.invalid/api/' 'Web'
          require_marker apps/vela-mobile/dist/spa 'https://example.invalid/api/' 'Mobile'
          require_marker apps/vela-mobile/dist/spa 'us-east-1_ciPlaceholder' 'Mobile'
          require_marker apps/vela-mobile/dist/spa 'ci-mobile-client-sentinel' 'Mobile'
          forbid_marker apps/vela-mobile/dist/spa 'ci-web-client-sentinel' 'Mobile'

      - name: Install Playwright Browsers
        run: bunx playwright install --with-deps chromium
        working-directory: ./apps/vela

      - name: Verify built tokenizer loads and tokenizes
        # tokenizer-build.spec.ts serves dist/spa itself; it catches zlibjs
        # interop regressions that only exist in the production bundle.
        run: bun --cwd=apps/vela run test:e2e:built-tokenizer

      - name: Build Lambda function
        run: bun --cwd=packages/cdk run lambda:build
