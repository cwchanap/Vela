name: Build & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  BUN_VERSION: "1.3.1"

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        id: install
        continue-on-error: true
        run: |
          set -o pipefail
          bun install --frozen-lockfile 2>&1 | tee bun-install.log

      - name: Upload Bun install diagnostics
        if: steps.install.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: bun-install-log
          path: bun-install.log

      - name: Fail when dependency installation fails
        if: steps.install.outcome == 'failure'
        run: exit 1

      - name: Run linter
        run: bun run lint

      - name: Build frontend
        # This workflow is a lint+build smoke test from a clean checkout, not
        # a deployment: there is no cdk-outputs.json to feed inject-env.ts, so
        # apps/vela-mobile/.env.production (gitignored) is absent. Bypass the
        # build-time mobile env guard rather than synthesizing CDK here. The
        # guard still fires for real release builds that run inject-env.ts.
        env:
          MOBILE_SKIP_ENV_VALIDATION: 'true'
        run: bun run build

      - name: Build Lambda function
        run: bun --cwd packages/cdk run lambda:build
